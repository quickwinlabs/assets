name: publish ISO (tiny10)

# Tiny10 23H2 x64 英文(NTDEV 第三方精简盘,基于 Win10 LTSC 2021,可服务化)—— 手动触发;
# 重跑覆盖 win-isos-tiny10 release 的分卷资产
# 注: 仅 archive.org 单源(NTDEV 官方 item),无备源
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download, split and publish
        run: ./scripts/publish.sh tiny10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
