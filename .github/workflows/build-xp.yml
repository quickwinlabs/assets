name: publish ISO (xp)

# XP SP3 中文 VL —— 手动触发;重跑覆盖 win-isos-xp release 的分卷资产
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download, split and publish
        run: ./scripts/publish.sh xp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
