name: build image (prebuilt disk)

# 在 runner 上现场安装一份 Windows 盘（images/setup-*.sh），压缩分卷后发布到
# win-images-<type> release —— 给不想自己装 Windows 的人直接下载使用。
#
# 一次只发一个 type：装机 15-60 分钟，且每个 job 要独占一台 runner 和 ~25GB 磁盘。
# ISO 取自本仓已发布的 win-isos-* release（fetch-release-iso.sh），
# 所以"发布出去的是什么 ISO，装出来的盘就是什么"。
on:
  workflow_dispatch:
    inputs:
      type:
        description: '要构建的类型'
        required: true
        type: choice
        options: [xp, win7, win11]
      publish:
        description: '构建完成后发布到 release（取消勾选 = 只构建不发布）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-image-${{ inputs.type }}
  cancel-in-progress: false

jobs:
  build:
    name: build image (${{ inputs.type }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # runner 只有 ~14GB SSD：win11 装机峰值（ISO 5.7G + 安装盘 12.5G + 压缩输出 ~7G）
      # 远超，先删掉镜像里用不到的大件
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      # OVMF 用 Ubuntu 的 ovmf 包（4M secboot，raw .fd），setup-win11.sh 按此路径取
      - name: Install QEMU and helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 qemu-utils ovmf swtpm socat \
              mtools dosfstools dos2unix genisoimage 7zip
          qemu-system-x86_64 --version | head -1

      # x86 的 ubuntu-latest 自带 /dev/kvm（2024 年起 runner 换成支持嵌套虚拟化的机型），
      # 但默认只有 kvm 组可写、runner 用户不在该组；2025 年镜像又调过一次权限。
      # quickwin 的 ci-qemu.yml 走 container + `--device /dev/kvm`——容器里是 root，
      # 所以直接能写；这里跑在宿主上就得自己放开。命令取自 GitHub 官方给的做法
      # （android-emulator-runner / actions/runner-images 也是这套）。
      # 注意 qemu 的 -accel kvm 打不开 /dev/kvm 时会直接报错，不会退回 TCG，
      # 放开后顺手断言一次（跟 ci-qemu.yml 里那句 probe 同一个意思）。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm 不可写"; exit 1; }

      - name: Fetch ISO from win-isos-* release
        run: |
          case "${{ inputs.type }}" in
            xp)    ISO_TYPE=xp;        ISO_DIR=images/iso/xp ;;
            win7)  ISO_TYPE=7u;        ISO_DIR=images/iso/win7 ;;
            win11) ISO_TYPE=tiny11std; ISO_DIR=images/iso/win11 ;;
          esac
          ./scripts/fetch-release-iso.sh "$ISO_TYPE" "$ISO_DIR"

      - name: Install Windows (${{ inputs.type }})
        working-directory: images
        run: ./setup-${{ inputs.type }}.sh

      # 装机完成后 ISO 不再需要，而压缩输出要和安装盘同时存在，先腾出这份空间
      - name: Reclaim ISO space
        run: |
          rm -f images/iso/*/*.iso
          df -h /

      - name: Package and publish
        if: ${{ inputs.publish }}
        run: ./scripts/make-image-release.sh "${{ inputs.type }}" "win-images-${{ inputs.type }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### build image: ${{ inputs.type }}"
            echo
            echo '```'
            ls -lh images/snapshots/ 2>/dev/null || echo "(no snapshots)"
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
